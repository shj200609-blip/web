      if (glowSprites[rgb]) return glowSprites[rgb];
      var c = document.createElement("canvas");
      c.width = c.height = 128;
      var g = c.getContext("2d");
      var r = 64;
      var grad = g.createRadialGradient(r, r, 0, r, r, r);
      grad.addColorStop(0, "rgba(" + rgb + ",1)");
      grad.addColorStop(1, "rgba(" + rgb + ",0)");
      g.fillStyle = grad;
      g.fillRect(0, 0, 128, 128);
      glowSprites[rgb] = c;
      return c;
    }

    var grainLayer = null;
    var vignetteLayer = null;
    var lastGrainUpdate = -Infinity;

    /* ---- embers: recycled particles rising from the burning edge ---- */
    var embers = [];
    for (var i = 0; i < 42; i++) {
      embers.push({
        ph: Math.random(),
        spd: 0.18 + Math.random() * 0.34,
        ox: (Math.random() - 0.5) * 0.070,
        oy: (Math.random() - 0.5) * 0.045,
        rise: 0.052 + Math.random() * 0.060,
        swayA: 3 + Math.random() * 10,
        swayF: 1.5 + Math.random() * 2.5,
        sz: 1.0 + Math.random() * 1.9,
        twF: 3 + Math.random() * 5,
        dep: Math.random()
      });
    }

    /* ---- cosmic dust drifting across the whole frame ---- */
    var dust = [];
    for (var j = 0; j < 110; j++) {
      dust.push({
        x: Math.random(), y: Math.random(),
        vx: (Math.random() - 0.5) * 0.006,
        vy: (Math.random() - 0.5) * 0.006,
        ph: Math.random() * 6.283,
        sp: 0.15 + Math.random() * 0.7,
        sz: 0.5 + Math.random() * 1.1
      });
    }

    /* ---- viewport ---- */
    var W = 0, H = 0, dpr = 1;
    function rebuildVignette() {
      vignetteLayer = document.createElement("canvas");
      vignetteLayer.width = W;
      vignetteLayer.height = H;
      var vc = vignetteLayer.getContext("2d");
      var vg = vc.createRadialGradient(
        W / 2, H / 2, Math.min(W, H) * 0.55,
        W / 2, H / 2, Math.max(W, H) * 0.95
      );
      vg.addColorStop(0, "rgba(2,6,12,0)");
      vg.addColorStop(1, "rgba(2,6,12,0.30)");
      vc.fillStyle = vg;
      vc.fillRect(0, 0, W, H);
    }

    function rebuildGrainLayer() {
      grainLayer = document.createElement("canvas");
      grainLayer.width = W;
      grainLayer.height = H;
      var gc = grainLayer.getContext("2d");
      var gsz = GR * Math.max(1, dpr * 0.75);
      gc.imageSmoothingEnabled = false;
      for (var gx = -Math.random() * gsz; gx < W; gx += gsz) {
        for (var gy = -Math.random() * gsz; gy < H; gy += gsz) {
          gc.drawImage(grain, gx, gy, gsz, gsz);
        }
      }
    }

    function resize() {
      var cssW = Math.max(1, window.innerWidth);
      var cssH = Math.max(1, window.innerHeight);
      var pixelCap = Math.sqrt(MAX_RENDER_PIXELS / (cssW * cssH));
      dpr = Math.min(window.devicePixelRatio || 1, DPR_CAP, pixelCap);
      var w = Math.max(1, Math.floor(cssW * dpr));
      var h = Math.max(1, Math.floor(cssH * dpr));
      if (canvas.width !== w || canvas.height !== h) {
        canvas.width = w;
        canvas.height = h;
        grainLayer = null;
        lastGrainUpdate = -Infinity;
      }
      W = canvas.width;
      H = canvas.height;
      if (!vignetteLayer || vignetteLayer.width !== W || vignetteLayer.height !== H) {
        rebuildVignette();
      }
    }
    window.addEventListener("resize", resize);
    window.addEventListener("orientationchange", resize);
    document.addEventListener("fullscreenchange", resize);
    if (window.visualViewport) window.visualViewport.addEventListener("resize", resize);
    resize();

    window.addEventListener("keydown", function (e) {
      if (e.key === "f" || e.key === "F") {
        if (document.fullscreenElement) { document.exitFullscreen(); }
        else if (document.documentElement.requestFullscreen) { document.documentElement.requestFullscreen(); }
      }
    });

    var slow = (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) ? 0.25 : 1.0;
    var hasFilter = typeof ctx.filter === "string";
    var TARGET_FPS = 30;
    var FRAME_INTERVAL = 1000 / TARGET_FPS;
    var lastFrame = -Infinity;

    /* Flame center inside cloud.png (normalized 0..1). */
    var FIRE = { x: 0.550, y: 0.275 };

    /* The source image is square. Cover fills the viewport so no side bars show. */
    var FIT_MODE = "cover";

    function glow(x, y, r, rgb, a) {
      if (a <= 0 || r <= 0) return;
      var oldAlpha = ctx.globalAlpha;
      ctx.globalAlpha = oldAlpha * a;
      ctx.drawImage(getGlowSprite(rgb), x - r, y - r, r * 2, r * 2);
      ctx.globalAlpha = oldAlpha;
    }
    var t0 = performance.now();
    function frame(now) {
      requestAnimationFrame(frame);
      if (document.hidden || now - lastFrame < FRAME_INTERVAL) return;
      lastFrame = now;
      var t = (now - t0) / 1000 * slow;
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.globalCompositeOperation = "source-over";
      ctx.globalAlpha = 1;
      ctx.imageSmoothingEnabled = true;
      if (hasFilter) ctx.filter = "none";
      ctx.fillStyle = "#050b14";
      ctx.fillRect(0, 0, W, H);
      if (!ready) return;

      /* ---- fill the viewport with a subtle breathing zoom ---- */
      var z = 1.008 + 0.001 * Math.sin(t * 0.11);
      var fit = FIT_MODE === "contain" ? Math.min : Math.max;
      var s = fit(W / iw, H / ih) * z;
      var dw = iw * s, dh = ih * s;
      var dx = (W - dw) / 2;
      var dy = (H - dh) / 2;

      ctx.imageSmoothingEnabled = true;
      if (ctx.imageSmoothingQuality !== undefined) ctx.imageSmoothingQuality = "high";

      /* Draw the source image once so the cloud edge stays single and crisp.
         No depth-slice offsets, edge shadow, or feathered compositing. */
      ctx.drawImage(img, dx, dy, dw, dh);

      function X(nx) { return dx + nx * dw; }
      function Y(ny) { return dy + ny * dh; }

      /* Keep the source flame unchanged; do not add a blurred glow over its edge. */
      ctx.globalCompositeOperation = "source-over";

      /* ---- embers rising from the flames ---- */
      for (var i = 0; i < embers.length; i++) {
        var e = embers[i];
        var life = (e.ph + t * e.spd) % 1;
        var fade = Math.sin(life * 3.14159);
        var ex = X(FIRE.x + e.ox)
          + Math.sin(life * e.swayF * 3.14159 + e.ph * 9.7) * e.swayA * dpr
          + life * W * 0.006;
        var ey = Y(FIRE.y + e.oy) - life * e.rise * H;
        var dep = 0.35 + e.dep * 1.15; /* near embers are larger, brighter, softer */
        var a = fade * (0.42 + 0.44 * Math.abs(Math.sin(t * e.twF + e.ph * 7.3))) * (0.50 + dep * 0.50);
        glow(ex, ey, e.sz * dep * 6 * dpr, "255,90,20", a * 0.52);
        ctx.fillStyle = "rgba(255,198,105," + (a * 0.96).toFixed(3) + ")";
        ctx.beginPath();
        ctx.arc(ex, ey, e.sz * dep * dpr, 0, 6.2832);
        ctx.fill();
      }

      /* ---- cosmic dust ---- */
      for (var k = 0; k < dust.length; k++) {
        var d = dust[k];
        var ux = ((d.x + t * d.vx) % 1 + 1) % 1;
        var uy = ((d.y + t * d.vy) % 1 + 1) % 1;
        var da = 0.10 + 0.30 * Math.abs(Math.sin(t * d.sp + d.ph));
        ctx.fillStyle = "rgba(226,236,250," + da.toFixed(3) + ")";
        ctx.beginPath();
        ctx.arc(ux * W, uy * H, d.sz * dpr, 0, 6.2832);
        ctx.fill();
      }

      /* ---- film grain: rebuild occasionally, composite once per frame ---- */
      if (!grainLayer || now - lastGrainUpdate > 120) {
        rebuildGrainLayer();
        lastGrainUpdate = now;
      }
      ctx.globalCompositeOperation = "overlay";
      ctx.globalAlpha = 0.55;
      ctx.drawImage(grainLayer, 0, 0);
      ctx.globalAlpha = 1;

      /* ---- cached cinematic vignette ---- */
      ctx.globalCompositeOperation = "source-over";
      if (vignetteLayer) ctx.drawImage(vignetteLayer, 0, 0);
    }
    requestAnimationFrame(frame);
  </script>
</body>

</html>
